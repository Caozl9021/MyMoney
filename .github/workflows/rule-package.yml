name: rule-package
on:
  workflow_dispatch:
  push:
    tags: ['rules-v*']
  pull_request:
    paths: ['billkit/rules/**', 'billkit/src/main/java/com/example/billkit/spec/**', 'billkit/src/main/java/com/example/billkit/notification/**', 'billkit/src/main/assets/spec/**', 'billkit/src/test/**', '.github/workflows/rule-package.yml']
concurrency:
  group: rule-package-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test release publication guards
        run: python3 -m unittest discover -s billkit/rules -p 'test_publish_release.py' -v
      - name: Build deterministic rule snapshot
        id: rule_version
        run: |
          version=$(python3 -c "import json; print(json.load(open('billkit/rules/package.json'))['packageVersion'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 billkit/rules/package.py --output-dir "dist/releases/rules-v${version}/upload"
      - name: Verify release tag matches package
        if: startsWith(github.ref, 'refs/tags/rules-v')
        run: |
          python3 - <<'PY'
          import json, os
          version = json.load(open('billkit/rules/package.json'))['packageVersion']
          assert os.environ['GITHUB_REF_NAME'] == 'rules-v' + version, 'tag/package version mismatch'
          PY
      - name: Production engine verification and tests (no APK)
        run: |
          ./gradlew :billkit:testDebugUnitTest :billkit:validateRulePackage -PrulePackage="$(find "$PWD/dist/releases" -name '*.zip' -print -quit)" --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: mymoney-rule-package
          path: dist/releases/rules-v${{ steps.rule_version.outputs.version }}/upload/*
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rules-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mymoney-rule-package
          path: release-artifact
      - name: Publish validated rule package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 billkit/rules/publish_release.py --artifact-dir release-artifact
