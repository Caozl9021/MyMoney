name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # 仓库里没有签名配置，CI 只验证「能编译、单测能过」，不产出可分发的包。
      - name: Unit tests
        run: ./gradlew :billkit:testDebugUnitTest :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            billkit/build/reports/tests/
          retention-days: 7
