name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK，不再用 android-actions/setup-android：
      # 它硬编码 cmdline-tools 下载地址，Google 轮换 URL 后整个 job 直接失败。
      # 这里只打印一下环境，缺组件时 AGP 会自己按 compileSdk 补装。
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "!! platforms 目录不存在"
          ls "${ANDROID_HOME}/build-tools" 2>/dev/null || echo "!! build-tools 目录不存在"

      - uses: gradle/actions/setup-gradle@v4

      # 仓库里没有签名配置，CI 只验证「能编译、单测能过」，不产出可分发的包。
      - name: Unit tests
        run: ./gradlew :billkit:testDebugUnitTest :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            billkit/build/reports/tests/
          retention-days: 7
