name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像自带 Android SDK，不再用 android-actions/setup-android：
      # 它硬编码 cmdline-tools 下载地址，Google 轮换 URL 后整个 job 直接失败。
      # 这里只打印一下环境，缺组件时 AGP 会自己按 compileSdk 补装。
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || echo "!! platforms 目录不存在"
          ls "${ANDROID_HOME}/build-tools" 2>/dev/null || echo "!! build-tools 目录不存在"

      # ocr-research/v6/generated/ 整个被 .gitignore 忽略（Paddle SDK 源码、模型 assets、合并后的
      # *-dual.aar 都不随仓库分发）。但 :ocr-v6 的 sourceSets 和 app 的依赖都引用它们，全新 checkout
      # 里没有就会构建失败（138 起 CI 一直红的根因）。这里跑模块自带的 prepare.py：从锁定 commit 的
      # PaddleOCR 拉 SDK 源码、从官方归档拉模型、并用已跟踪的 runtime/*-{arm64,x86_64}.aar 合并出
      # dual AAR。全部按 config/*.json 里的 sha256 校验，可复现。
      - name: Prepare OCR v6 generated inputs
        run: python3 ocr-research/v6/prepare.py

      - uses: gradle/actions/setup-gradle@v4

      # 仓库里没有签名配置，CI 只验证「能编译、单测能过」，不产出可分发的包。
      - name: Unit tests
        run: ./gradlew :billkit:testDebugUnitTest :app:testDebugUnitTest --console=plain --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            billkit/build/reports/tests/
          retention-days: 7
