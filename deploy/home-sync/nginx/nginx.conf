# 麦米家庭服务反向代理：nginx 对外，uvicorn 仅内网 127.0.0.1。
# 目的：更正式的前置（gzip、安全响应头、请求限流、连接韧性），不改应用语义。
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 210m;   # 备份上传上限 200MiB + 余量

    # 连接级限流：正常单机备份/同步远低于此；防手滑刷接口。
    limit_req_zone $binary_remote_addr zone=admin:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api:10m   rate=60r/s;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    upstream mymoney_backend { server 127.0.0.1:18081; keepalive 16; }

    server {
        listen 18080;
        server_name _;

        # 统一安全响应头（应用自身的 CSP/no-store 仍透传，不覆盖）
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # 管理页与出码接口更保守限流
        location ~ ^/admin/ {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://mymoney_backend;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }
        location ~ ^/v1/admin/ {
            limit_req zone=admin burst=20 nodelay;
            proxy_pass http://mymoney_backend;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }
        location / {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://mymoney_backend;
            include /etc/nginx/conf.d/proxy_headers.conf;
        }
    }
}
